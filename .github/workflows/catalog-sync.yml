name: Sync work catalog

on:
  schedule:
    # Mondays 03:17 UTC — regenerate the catalog from repos tagged 'portfolio'
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/catalog-sync.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit if changed
        run: |
          if ! git diff --quiet -- data/catalog.json; then
            git config user.name "catalog-bot"
            git config user.email "actions@github.com"
            git add data/catalog.json
            git commit -m "chore: sync work catalog"
            git push
            # Pushes made with GITHUB_TOKEN don't trigger other workflows —
            # dispatch the deploy explicitly so the site rebuilds.
            gh workflow run deploy.yml
          else
            echo "Catalog unchanged — nothing to commit."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
