name: Weekly learnings note

# Sunday compile of the private notes inbox into a published learnings note.
# Replaces the per-laptop Task Scheduler job (scripts/weekly-note-task.cmd):
# notes captured on any device sync to the Worker's /inbox, so a runner with
# no local drafts folder still has everything the weekly-note skill needs.
on:
  schedule:
    # Sundays 14:34 UTC = 20:04 IST, the slot the laptop job used
    - cron: '34 14 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

# One compile at a time: two runs would race for the same pending notes.
concurrency:
  group: weekly-note
  cancel-in-progress: false

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # Cheap pre-check so an empty week never spends a Claude run.
      - name: Count pending notes
        id: pending
        env:
          CAPTURE_SYNC_TOKEN: ${{ secrets.CAPTURE_SYNC_TOKEN }}
        run: |
          count=$(curl -sf -H "Authorization: Bearer $CAPTURE_SYNC_TOKEN" \
            https://api.lokeshnanda.com/inbox | jq '.notes | length')
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Pending notes: $count"
          if [ "$count" = "0" ]; then
            echo "Inbox empty, nothing to publish." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/setup-node@v4
        if: steps.pending.outputs.count != '0'
        with:
          node-version: 22
          cache: npm

      - run: npm ci
        if: steps.pending.outputs.count != '0'

      - name: Install Claude Code
        if: steps.pending.outputs.count != '0'
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Compile and publish
        if: steps.pending.outputs.count != '0'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          CAPTURE_SYNC_TOKEN: ${{ secrets.CAPTURE_SYNC_TOKEN }}
        run: |
          git config user.name "weekly-note-bot"
          git config user.email "actions@github.com"
          echo "$(git rev-parse HEAD)" > /tmp/head-before
          # Same allowlist as the laptop job. The /inbox sync goes through
          # scripts/inbox-sync.mjs, which reads the token itself: headless
          # Claude refuses shell commands that expand a variable, so the
          # skill could never hand the secret to curl directly.
          timeout 30m claude -p "/weekly-note" \
            --allowedTools "Read,Write,Edit,Glob,Grep,Skill,Bash(node scripts/inbox-sync.mjs *),Bash(npm run build),Bash(git *),Bash(mv *),Bash(mkdir *),Bash(ls *),Bash(cat *)"

      # Pushes made with GITHUB_TOKEN don't trigger other workflows, so
      # dispatch both deploys explicitly (see catalog-sync.yml). Learnings feed
      # the site and the chatbot's retrieval corpus, so each needs its own run.
      - name: Dispatch deploys if a note was pushed
        if: steps.pending.outputs.count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$(cat /tmp/head-before)" ]; then
            echo "New commit on main, dispatching deploys."
            gh workflow run deploy.yml
            gh workflow run worker-deploy.yml
          else
            echo "No commit pushed, nothing to deploy." >> "$GITHUB_STEP_SUMMARY"
          fi
