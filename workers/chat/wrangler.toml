name = "profile-chat"
main = "src/index.js"
compatibility_date = "2026-08-01"

# Workers custom domain — Cloudflare creates the DNS record + cert for
# api.lokeshnanda.com itself; the apex stays grey-cloud for GitHub Pages.
routes = [
  { pattern = "api.lokeshnanda.com", custom_domain = true }
]

# Markdown files import as text (profile grounding for the system prompt)
rules = [
  { type = "Text", globs = ["**/*.md"], fallthrough = true }
]

# Refresh data/site-index.json before every dev/deploy so chat answers can
# cite current posts, learnings and apps.
[build]
command = "node ../../scripts/site-index.mjs"

[vars]
ALLOWED_ORIGIN = "https://lokeshnanda.com"
OPIK_WORKSPACE = "lokesh-nanda"

[[kv_namespaces]]
binding = "RATE"
id = "b5b4a07571684190b3a8b98067e165d8"
